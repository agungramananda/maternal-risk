version: "3.8"

services:
  app:
    build: .
    container_name: maternal-risk-app
    ports:
      - "8501:8501"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./model:/app/model
    restart: unless-stopped
